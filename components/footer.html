<section class="block contact" id="contato" aria-labelledby="contact-h">
  <div class="confetti" data-confetti="contact" aria-hidden="true"></div>
  <div class="wrap">
    <span class="eyebrow">
      <svg aria-hidden="true"><use href="#sh-flower" /></svg>
      <span data-i18n="contact-eyebrow"></span>
    </span>
    <h2 id="contact-h" data-i18n="cta-title"></h2>
    <div class="mail">
      <a class="addr" href="mailto:carmemjeovana@gmail.com" id="mail-addr"

      <button class="copy" type="button" id="copy-btn">
        <svg aria-hidden="true"><use href="#i-copy" /></svg>

<footer class="foot">
