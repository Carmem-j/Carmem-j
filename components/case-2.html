<main id="main-content">
  <article class="case wrap" data-c="orange" aria-labelledby="case-h">
    <a
      class="back"
      href="/#projetos"
      onclick="
        navigateTo('projetos');
        return false;
      "
      title="Voltar para projetos"
    >
      <svg aria-hidden="true"><use href="#i-arrow" /></svg>
      <span data-i18n="btn-back"></span>
    </a>

    <header class="case-head">
      <span class="kicker">
        <svg aria-hidden="true"><use href="#sh-square" /></svg>
        <span data-i18n="case2-tag"></span>
      </span>
      <h1 id="case-h" data-i18n="case2-title"></h1>
      <p class="lead" data-i18n="case2-desc"></p>
    </header>

    <div class="case-art" aria-hidden="true">
      <svg viewBox="0 0 400 237" preserveAspectRatio="xMidYMid meet">
        <g fill="var(--orange)">
        <rect x="60" y="170" width="46" height="46" rx="6" opacity=".35"/>
        <rect x="122" y="170" width="46" height="46" rx="6" opacity=".55"/><rect x="122" y="116" width="46" height="46" rx="6" opacity=".55"/>
        <rect x="184" y="170" width="46" height="46" rx="6" opacity=".8"/><rect x="184" y="116" width="46" height="46" rx="6" opacity=".8"/><rect x="184" y="62" width="46" height="46" rx="6" opacity=".8"/>
        <rect x="246" y="170" width="46" height="46" rx="6"/><rect x="246" y="116" width="46" height="46" rx="6"/><rect x="246" y="62" width="46" height="46" rx="6"/>
        </g>
        <rect x="246" y="8" width="46" height="46" rx="6" fill="none" stroke="var(--fg)" stroke-width="3" stroke-dasharray="6 6"/>
        <use href="#sh-flower" x="304" y="14" width="40" height="40" color="var(--mint)" class="spin"/>
        <use href="#sh-circle" x="318" y="150" width="46" height="46" color="var(--pink)"/>
        <path d="M52 150 130 96 190 52" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
        <path d="M178 50 194 50 190 66" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="case-meta">
      <div>
        <small data-i18n="meta-role"></small>
        <b data-i18n="meta-role-val-1"></b>
      </div>
      <div>
        <small data-i18n="meta-year"></small>
        <b data-i18n="case2-year"></b>
      </div>
      <div>
        <small data-i18n="meta-duration"></small>
        <b data-i18n="case2-duration"></b>
      </div>
      <div>
        <small data-i18n="meta-focus"></small>
        <b data-i18n="case2-focus"></b>
      </div>
    </div>

    <div class="disclaimer" role="note">
      <svg aria-hidden="true"><use href="#i-info" /></svg>
      <p><b data-i18n="case2-disclaimer-title"></b> <span data-i18n="case2-disclaimer-full"></span></p>
    </div>

    <div class="case-body">
      <nav class="toc" aria-labelledby="toc-label">
        <small id="toc-label" data-i18n="case-toc"></small>
        <div data-toc></div>
      </nav>
      <div class="case-content">
        <section class="cs">
          <h2 data-i18n="case2-overview-title"></h2>
          <p data-i18n="case2-overview-p1"></p>
        </section>

        <section class="cs">
          <h2 data-i18n="case2-problem-title"></h2>
          <p data-i18n="case2-problem-p1"></p>
          <ul>
            <li data-i18n="case2-problem-l1"></li>
            <li data-i18n="case2-problem-l2"></li>
            <li data-i18n="case2-problem-l3"></li>
            <li data-i18n="case2-problem-l4"></li>
          </ul>

          <h3 data-i18n="case2-objectives-title"></h3>
          <ul>
            <li data-i18n="case2-obj-1"></li>
            <li data-i18n="case2-obj-2"></li>
            <li data-i18n="case2-obj-3"></li>
          </ul>
        </section>

        <section class="cs">
          <h2 data-i18n="case2-research-title"></h2>
          <p data-i18n="case2-research-p1"></p>

          <h3 data-i18n="case2-research-challenges-title"></h3>

          <h4 data-i18n="case2-research-c1-title"></h4>
          <p data-i18n="case2-research-c1-p1"></p>

          <h4 data-i18n="case2-research-c2-title"></h4>
          <p data-i18n="case2-research-c2-p1"></p>
        </section>

        <section class="cs">
          <h2 data-i18n="case2-decisions-title"></h2>
          <p data-i18n="case2-decisions-p1"></p>
          <p data-i18n="case2-decisions-p2"></p>
          <ul>
            <li data-i18n="case2-decisions-l1"></li>
            <li data-i18n="case2-decisions-l2"></li>
            <li data-i18n="case2-decisions-l3"></li>
          </ul>

          <figure class="shot narrow">
            <button type="button" class="zoom" data-lightbox>
              <img
                src="images/case2-seletor-span-fracking.png"
                alt="Interface de um modal de seleção de tipos de span de widget."
                data-i18n-alt="case2-img-span-alt"
                width="666"
                height="599"
                loading="lazy"
                decoding="async"
              />
              <span class="zi" aria-hidden="true"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M11 8v6M8 11h6"></path></svg></span>
              <span class="sr-only" data-i18n="lightbox-open"></span>
            </button>
            <figcaption data-i18n="case2-img-span-caption"></figcaption>
          </figure>
        </section>

        <section class="cs">
          <h2 data-i18n="case2-results-title"></h2>
          <p data-i18n="case2-results-p1"></p>
          <ul>
            <li data-i18n="case2-results-l1"></li>
            <li data-i18n="case2-results-l2"></li>
            <li data-i18n="case2-results-l3"></li>
          </ul>
          <p data-i18n="case2-results-p2"></p>

          <div class="res">
            <div>
              <b data-i18n="case2-metric1-value"></b>
              <small data-i18n="case2-metric1-label"></small>
              <span data-i18n="case2-metric1-desc"></span>
            </div>
            <div>
              <b data-i18n="case2-metric2-value"></b>
              <small data-i18n="case2-metric2-label"></small>
              <span data-i18n="case2-metric2-desc"></span>
            </div>
          </div>

          <h3 data-i18n="case2-generic-title"></h3>
          <p data-i18n="case2-generic-p1"></p>
          <p data-i18n="case2-generic-p2"></p>

          <figure class="shot">
            <button type="button" class="zoom" data-lightbox>
              <img
                src="images/case2-top-band.webp"
                alt="Top Band: interface de edição do widget, com os estados (stages) de um poço exibidos em uma faixa no topo de um gráfico de série temporal."
                data-i18n-alt="case2-img-topband-alt"
                width="2000"
                height="1047"
                loading="lazy"
                decoding="async"
              />
              <span class="zi" aria-hidden="true"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M11 8v6M8 11h6"></path></svg></span>
              <span class="sr-only" data-i18n="lightbox-open"></span>
            </button>
            <figcaption data-i18n="case2-img-topband-caption"></figcaption>
          </figure>

          <figure class="shot">
            <button type="button" class="zoom" data-lightbox>
              <img
                src="images/case2-flags.png"
                alt="Flags: interface de edição do widget, com os estados (stages) de um poço marcados por linhas verticais tracejadas sobre um gráfico de série temporal."
                data-i18n-alt="case2-img-flags-alt"
                width="1934"
                height="1037"
                loading="lazy"
                decoding="async"
              />
              <span class="zi" aria-hidden="true"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M11 8v6M8 11h6"></path></svg></span>
              <span class="sr-only" data-i18n="lightbox-open"></span>
            </button>
            <figcaption data-i18n="case2-img-flags-caption"></figcaption>
          </figure>
        </section>

        <section class="cs">
          <h2 data-i18n="case2-learnings-title"></h2>
          <p data-i18n="case2-learnings-p1"></p>
          <ul>
            <li data-i18n="case2-learnings-l1"></li>
            <li data-i18n="case2-learnings-l2"></li>
            <li data-i18n="case2-learnings-l3"></li>
          </ul>
        </section>
      </div>
    </div>

    <a
      class="next"
      data-nc="cyan"
      href="#case-1"
      hx-get="components/case-1.html"
      hx-target="#app"
      hx-swap="innerHTML"
      hx-push-url="#case-1"
    >
      <div>
        <small data-i18n="case-next"></small>
        <b data-i18n="case1-title"></b>
      </div>
      <svg aria-hidden="true"><use href="#i-arrow" /></svg>
    </a>

    <div class="case-cta">
      <h2 data-i18n="case-cta-title"></h2>
      <a class="btn primary" href="#contato">
        <span data-i18n="case-cta-btn"></span>
        <svg aria-hidden="true"><use href="#i-arrow" /></svg>
      </a>
    </div>
  </article>
</main>
