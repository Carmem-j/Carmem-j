<section class="hero" id="top">
  <div class="confetti" data-confetti="hero" aria-hidden="true"></div>
  <div class="wrap hero-grid">
    <div>
      <h1 data-i18n="hero-title"></h1>
      <p class="lede" data-i18n="hero-desc"></p>
      <div class="cta-row">
        <a
          class="btn primary"
          href="#projetos"
          onclick="
            navigateTo('projetos');
            return false;
          "
        >
          <span data-i18n="btn-projects"></span>
          <svg aria-hidden="true"><use href="#i-arrow" /></svg>
        </a>
        <a
          class="btn ghost"
          href="#contato"
          data-i18n="nav-contact"
          title="Contato"
        ></a>
      </div>
    </div>
    <div class="portrait">
      <div class="ring" aria-hidden="true"></div>
      <img
        class="av"
        src="images/avatar.png"
        alt="Ilustração de Carmem: cabelo cacheado rosa e roxo, piscando e fazendo o sinal de paz"
        data-i18n-alt="hero-avatar-alt"
        width="400"
        height="400"
        fetchpriority="high"
        decoding="async"
      />
      <span class="badge b1"><i></i><span data-i18n="hero-badge-1"></span></span>
      <span class="badge b2"><i></i><span>WCAG 2.2</span></span>
      <span class="badge b3"><i></i><span data-i18n="hero-badge-3"></span></span>
    </div>
  </div>
  <button
    type="button"
    id="anim-toggle"
    class="anim-toggle"
    onclick="toggleAnimation()"
  >
    <svg aria-hidden="true"><use href="#i-pause" /></svg>
    <span class="lbl">Pausar animação</span>
  </button>
</section>
