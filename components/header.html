<header class="top">
  <div class="wrap bar">
    <a
      class="logo"
      href="#top"
      onclick="
        navigateTo('top');
        return false;
      "
      title="Carmem Ferreira"
    >
      <img
        src="images/avatar-96.png"
        alt=""
        width="34"
        height="34"
        decoding="async"
      />
      <span class="nm">Carmem Ferreira<span class="dot">.</span></span>
    </a>

    <nav class="main" aria-label="Navegação Principal">
      <a
        href="#sobre"
        onclick="
          navigateTo('sobre');
          return false;
        "
        title="Sobre"
        data-i18n="nav-about"
      ></a>
      <a
        href="#projetos"
        onclick="
          navigateTo('projetos');
          return false;
        "
        title="Projetos"
        data-i18n="nav-projects"
      ></a>
      <a href="#contato" title="Contato" data-i18n="nav-contact"></a>

      <div class="lang" role="group" aria-label="Selecionar idioma">
        <button
          type="button"
          onclick="setLanguage('pt')"
          lang="pt"
          aria-label="Mudar idioma para Português"
          aria-pressed="true"
        >
          PT
        </button>
        <button
          type="button"
          onclick="setLanguage('en')"
          lang="en"
          aria-label="Switch language to English"
          aria-pressed="false"
        >
          EN
        </button>
      </div>

      <button
        type="button"
        class="burger"
        id="mobile-menu-toggle"
        onclick="toggleMobileMenu()"
        aria-controls="mobile-menu"
        aria-expanded="false"
        aria-label="Abrir menu de navegação"
      >
        <svg
          class="i-menu"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        <svg
          class="i-close"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    </nav>
  </div>

  <!-- Painel do menu mobile -->
  <div id="mobile-menu" class="mobile-menu" hidden>
    <div class="wrap">
      <ul>
        <li>
          <a
            href="#sobre"
            onclick="
              closeMobileMenu();
              navigateTo('sobre');
              return false;
            "
            title="Sobre"
          >
            <svg class="c-mint" aria-hidden="true"><use href="#sh-circle" /></svg>
            <span data-i18n="nav-about"></span>
            <svg class="go" aria-hidden="true"><use href="#i-arrow" /></svg>
          </a>
        </li>
        <li>
          <a
            href="#projetos"
            onclick="
              closeMobileMenu();
              navigateTo('projetos');
              return false;
            "
            title="Projetos"
          >
            <svg class="c-pink" aria-hidden="true"><use href="#sh-tri" /></svg>
            <span data-i18n="nav-projects"></span>
            <svg class="go" aria-hidden="true"><use href="#i-arrow" /></svg>
          </a>
        </li>
        <li>
          <a href="#contato" onclick="closeMobileMenu();" title="Contato">
            <svg class="c-orange" aria-hidden="true"><use href="#sh-square" /></svg>
            <span data-i18n="nav-contact"></span>
            <svg class="go" aria-hidden="true"><use href="#i-arrow" /></svg>
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>
