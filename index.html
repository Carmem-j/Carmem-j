    <style>
      :root {
        --bg-primary: #ffffff;
        --text-primary: #18181b;
        --accent: #2563eb;
      }
      body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
        background-color: var(--bg-primary);
        color: var(--text-primary);
      }

      /* Acessibilidade Restaurada */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: var(--accent);
        color: white;
        padding: 8px;
        z-index: 100;
        transition: top 0.3s;
      }
      .skip-link:focus {
        top: 0;
      }

      /* Estilos do Carrossel Restaurados */
      .carousel-track {
        display: flex;
        width: max-content;
        animation: scroll 40s linear infinite;
        align-items: center;
      }
      .carousel-track:hover {
        animation-play-state: paused;
      }
      @keyframes scroll {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }

      /* Case typography using CSS (no @apply needed for descendant selectors) */
      .case-text h2 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #18181b;
        margin-top: 3rem;
        margin-bottom: 1.5rem;
        text-transform: uppercase;
        letter-spacing: -0.025em;
      }
      .case-text h3 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #18181b;
        margin-top: 2rem;
        margin-bottom: 1rem;
      }
      .case-text p {
        color: #52525b;
        line-height: 1.625;
        margin-bottom: 1.5rem;
      }
      .case-text ul {
        list-style-type: disc;
        padding-left: 1.5rem;
        margin-bottom: 2rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        color: #52525b;
      }
      .case-text blockquote {
        border-left: 4px solid #2563eb;
        padding-left: 1.5rem;
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
        font-style: italic;
        background-color: #f4f4f5;
        border-radius: 0 0.5rem 0.5rem 0;
        margin-bottom: 2rem;
        color: #3f3f46;
      }

      /* Language switch (efeito de toggle deslizante) */
      .lang-switch {
        isolation: isolate;
      }
      .lang-switch-thumb {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 32px;
        height: 32px;
        background-color: #18181b;
        border-radius: 9999px;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        transform: translateX(0);
        z-index: 0;
      }
      .lang-switch-thumb.is-en {
        transform: translateX(calc(32px + 0.5rem));
      }
      /* Language button active state */
      .lang-btn-active {
        color: white !important;
      }

      /* Botões de download de currículo */
      .resume-btn {
        background-color: #18181b;
        color: #ffffff;
      }
      .resume-btn:hover {
        background-color: #ffffff;
        color: #18181b;
      }

      /* Botões da Hero */
      .hero-btn-primary {
        background-color: #18181b !important;
        color: #ffffff !important;
      }
      .hero-btn-primary:hover {
        background-color: #27272a !important;
        transform: scale(1.05);
      }
      .hero-btn-secondary {
        background-color: transparent !important;
        color: #18181b !important;
        border: 1px solid #18181b !important;
      }
      .hero-btn-secondary:hover {
        background-color: #fafafa !important;
        transform: scale(1.05);
      }

      /* Botões de idioma - área de toque mínima WCAG 2.2 (2.5.8) */
      .lang-btn {
        position: relative;
        z-index: 1;
        min-width: 32px;
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* Foco visível para navegação por teclado (WCAG 2.4.7) */
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 4px;
      }

      /* Respeito à preferência do usuário por movimento reduzido (WCAG 2.3.3) */
      @media (prefers-reduced-motion: reduce) {
        .carousel-track {
          animation: none;
        }
        body {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

  <body class="antialiased">
    <noscript>
      <div
        class="fixed top-0 left-0 right-0 p-4 bg-yellow-100 text-zinc-900 text-center z-[9999] border-b border-yellow-300"
      >
        <strong>JavaScript desabilitado.</strong> Este site precisa de
        JavaScript para carregar componentes e suportar tradução. Por favor,
        habilite-o no seu navegador. /
        <strong>JavaScript disabled.</strong> This site requires JavaScript to
        load components and support translations. Please enable it in your
        browser.
      </div>
    </noscript>

    <a href="#main-content" class="skip-link"
      >Pular para o conteúdo principal</a
    >

    <div
      hx-get="components/header.html"
      hx-trigger="load"
      hx-swap="outerHTML"
    ></div>

    <div id="app">
      <main id="main-content">
        <div
          hx-get="components/hero.html"
          hx-trigger="load"
          hx-swap="innerHTML"
        ></div>
      </main>

      <div
        hx-get="components/brands.html"
        hx-trigger="load"
        hx-swap="outerHTML"
      ></div>

      <div
        hx-get="components/projects.html"
        hx-trigger="load"
        hx-swap="outerHTML"
      ></div>
    </div>

    <div
      hx-get="components/footer.html"
      hx-trigger="load"
      hx-swap="outerHTML"
    ></div>

    <script>
      let translations = {};
      const storedLang = localStorage.getItem('preferredLang');
      let currentLang = storedLang === 'pt' || storedLang === 'en' ? storedLang : 'pt';

      async function initI18n() {
        const res = await fetch('translations.json');
        translations = await res.json();
        translatePage();
        updateLanguageButtons();

        // Handle direct URL with case hash (e.g. /#case-1)
        const caseMatch = window.location.hash.match(/^#case-([1-3])$/);
        if (caseMatch) {
          htmx.ajax('GET', `components/case-${caseMatch[1]}.html`, {
            target: '#app',
            swap: 'innerHTML',
          });
          return;
        }

        const scrollTarget = sessionStorage.getItem('scrollAfterLoad');
        if (scrollTarget) {
          sessionStorage.removeItem('scrollAfterLoad');
          setTimeout(() => {
            const el = document.getElementById(scrollTarget);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          }, 400);
        }
      }

      function translatePage() {
        const dict = translations[currentLang] || translations.pt || {};
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.getAttribute('data-i18n');
          if (dict[key]) {
            // Usa innerHTML para permitir renderizar o blockquote e tags que possam vir da tradução
            el.innerHTML = dict[key];
          }
        });
        document.documentElement.lang = currentLang === 'pt' ? 'pt-BR' : 'en';
        updateResumeLinks();
      }

      function updateResumeLinks() {
        const suffix = currentLang === 'pt' ? 'pt' : 'eng';
        const docxLink = document.getElementById('resume-download-docx');
        const pdfLink = document.getElementById('resume-download-pdf');
        if (docxLink) {
          docxLink.setAttribute(
            'href',
            `files/Carmem_Ferreira - Resume_${suffix}.docx`
          );
        }
        if (pdfLink) {
          pdfLink.setAttribute(
            'href',
            `files/Carmem_Ferreira - Resume_${suffix}.pdf`
          );
        }
      }

      function updateLanguageButtons() {
        document
          .querySelectorAll('button[onclick*="setLanguage"]')
          .forEach((btn) => {
            btn.classList.remove('lang-btn-active');
            const btnLang = btn.textContent.trim().toLowerCase();
            const isActive = btnLang === currentLang;
            if (isActive) {
              btn.classList.add('lang-btn-active');
            }
            btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
          });

        document.querySelectorAll('.lang-switch-thumb').forEach((thumb) => {
          thumb.classList.toggle('is-en', currentLang === 'en');
        });
      }

      function navigateTo(id) {
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth' });
        } else {
          sessionStorage.setItem('scrollAfterLoad', id);
          window.location.href = window.location.pathname;
        }
      }

      function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('preferredLang', lang);
        translatePage();
        updateLanguageButtons();
      }

      function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        const toggle = document.getElementById('mobile-menu-toggle');
        if (!menu || !toggle) return;
        const isOpen = !menu.classList.contains('hidden');
        if (isOpen) {
          menu.classList.add('hidden');
          toggle.setAttribute('aria-expanded', 'false');
          toggle.setAttribute('aria-label', 'Abrir menu de navegação');
        } else {
          menu.classList.remove('hidden');
          toggle.setAttribute('aria-expanded', 'true');
          toggle.setAttribute('aria-label', 'Fechar menu de navegação');
        }
      }

      function closeMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        const toggle = document.getElementById('mobile-menu-toggle');
        if (!menu || !toggle) return;
        menu.classList.add('hidden');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Abrir menu de navegação');
      }

      document.body.addEventListener('htmx:afterOnLoad', () => {
        translatePage();
        updateLanguageButtons();
        window.scrollTo(0, 0);
      });

      window.onload = initI18n;
    </script>
