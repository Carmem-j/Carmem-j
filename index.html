    <dialog id="lightbox" aria-label="Imagem ampliada" data-i18n-label="lightbox-label">

    <script>
      let translations = {};
      const storedLang = localStorage.getItem('preferredLang');
      let currentLang = storedLang === 'pt' || storedLang === 'en' ? storedLang : 'pt';

      // Preferência do usuário: animação do hero pausada (WCAG 2.2.2)
      try {
        if (localStorage.getItem('animPaused') === '1') {
          document.documentElement.classList.add('anim-paused');
        }
      } catch (e) {}

      const TOC_ICONS = ['sh-circle', 'sh-square', 'sh-tri', 'sh-flower'];
      const CONFETTI_COLORS = ['#7B3FF2', '#FF5C9D', '#E8A0F0', '#3FE3C2', '#FFA93B', '#52C8F0', '#A58BFF', '#B0448B'];

      async function initI18n() {
        const res = await fetch('translations.json');
        translations = await res.json();
        translatePage();
        updateLanguageButtons();

        // Handle direct URL with case hash (e.g. /#case-1)
        const caseMatch = window.location.hash.match(/^#case-([1-4])$/);
        if (caseMatch) {
          htmx.ajax('GET', `components/case-${caseMatch[1]}.html`, {
            target: '#app',
            swap: 'innerHTML',
          });
          return;
        }

        const scrollTarget = sessionStorage.getItem('scrollAfterLoad');
        if (scrollTarget) {
          sessionStorage.removeItem('scrollAfterLoad');
          setTimeout(() => {
            const el = document.getElementById(scrollTarget);
            if (el) el.scrollIntoView({ behavior: scrollBehavior() });
          }, 400);
        }
      }

      function t(key) {
        const dict = translations[currentLang] || translations.pt || {};
        return dict[key] || '';
      }

      function translatePage() {
        const dict = translations[currentLang] || translations.pt || {};
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.getAttribute('data-i18n');
          if (dict[key]) {
            // Usa innerHTML para permitir tags (strong, span.hl, blockquote) nos textos
            el.innerHTML = dict[key];
          }
        });
        document.querySelectorAll('[data-i18n-alt]').forEach((el) => {
          const key = el.getAttribute('data-i18n-alt');
          if (dict[key]) {
            el.setAttribute('alt', dict[key]);
          }
        });
        document.querySelectorAll('[data-i18n-label]').forEach((el) => {
          const key = el.getAttribute('data-i18n-label');
          if (dict[key]) {
            el.setAttribute('aria-label', dict[key]);
          }
        });
        document.documentElement.lang = currentLang === 'pt' ? 'pt-BR' : 'en';
        updateDocumentTitle();
        syncAnimToggle();
        updateResumeLinks();
        buildToc();
        syncMenuToggle();
      }

      // Título da aba: muda por idioma e por case (WCAG 2.4.2)
      function updateDocumentTitle() {
        const caseTitle = document.querySelector('.case-head h1');
        if (caseTitle && caseTitle.textContent.trim()) {
          document.title = `${caseTitle.textContent.trim()} | Carmem Ferreira`;
        } else if (t('page-title')) {
          document.title = t('page-title');
        }
      }

      function syncAnimToggle() {
        const btn = document.getElementById('anim-toggle');
        if (!btn) return;
        const paused = document.documentElement.classList.contains('anim-paused');
        const label = t(paused ? 'anim-resume' : 'anim-pause');
        if (label) btn.querySelector('.lbl').textContent = label;
        btn.querySelector('use').setAttribute('href', paused ? '#i-play' : '#i-pause');
      }

      function toggleAnimation() {
        const paused = document.documentElement.classList.toggle('anim-paused');
        try {
          localStorage.setItem('animPaused', paused ? '1' : '0');
        } catch (e) {}
        syncAnimToggle();
      }

      // Respeita prefers-reduced-motion também na rolagem feita por JS
      function scrollBehavior() {
        return window.matchMedia('(prefers-reduced-motion: reduce)').matches
          ? 'auto'
          : 'smooth';
      }

      function updateResumeLinks() {
        const isPt = currentLang === 'pt';
        const link = document.getElementById('resume-download');
        if (!link) return;
        link.setAttribute(
          'href',
          `files/Carmem_Ferreira - Resume_${isPt ? 'pt' : 'eng'}.pdf`
        );
        // Nome sugerido ao salvar o arquivo
        link.setAttribute(
          'download',
          isPt ? 'Carmem Ferreira - CV.pdf' : 'Carmem Ferreira - Resume.pdf'
        );
      }

      function updateLanguageButtons() {
        document
          .querySelectorAll('button[onclick*="setLanguage"]')
          .forEach((btn) => {
            const isActive = btn.textContent.trim().toLowerCase() === currentLang;
            btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
          });
      }

      function navigateTo(id) {
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: scrollBehavior() });
        } else {
          sessionStorage.setItem('scrollAfterLoad', id);
          window.location.href = window.location.pathname;
        }
      }

      function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('preferredLang', lang);
        translatePage();
        updateLanguageButtons();
      }

      /* ---------- menu hambúrguer (mobile) ---------- */
      function isMenuOpen() {
        const menu = document.getElementById('mobile-menu');
        return !!menu && !menu.hidden;
      }

      function syncMenuToggle() {
        const toggle = document.getElementById('mobile-menu-toggle');
        if (!toggle) return;
        const open = isMenuOpen();
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        const label = t(open ? 'menu-close' : 'menu-open');
        if (label) toggle.setAttribute('aria-label', label);
      }

      function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        if (!menu) return;
        menu.hidden = !menu.hidden;
        syncMenuToggle();
      }

      function closeMobileMenu(returnFocus) {
        const menu = document.getElementById('mobile-menu');
        if (!menu || menu.hidden) return;
        menu.hidden = true;
        syncMenuToggle();
        if (returnFocus) {
          const toggle = document.getElementById('mobile-menu-toggle');
          if (toggle) toggle.focus();
        }
      }

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && isMenuOpen()) closeMobileMenu(true);
      });
      document.addEventListener('click', (event) => {
        if (isMenuOpen() && !event.target.closest('header.top')) closeMobileMenu();
      });
      window.matchMedia('(min-width: 641px)').addEventListener('change', (e) => {
        if (e.matches) closeMobileMenu();
      });

      /* ---------- índice lateral dos cases ---------- */
      function buildToc() {
        const holder = document.querySelector('[data-toc]');
        if (!holder) return;
        const sections = document.querySelectorAll('.case-content > section.cs');
        let html = '';
        sections.forEach((section, i) => {
          const h2 = section.querySelector('h2');
          if (!h2) return;
          if (!section.id) section.id = `cs-${i + 1}`;
          const icon = TOC_ICONS[i % TOC_ICONS.length];
          html += `<a href="#${section.id}" data-go="${section.id}"><svg aria-hidden="true"><use href="#${icon}"></use></svg><span>${h2.textContent}</span></a>`;
        });
        holder.innerHTML = html;
      }

      document.addEventListener('click', (event) => {
        const link = event.target.closest('a[data-go]');
        if (!link) return;
        event.preventDefault();
        const target = document.getElementById(link.dataset.go);
        if (target) target.scrollIntoView({ behavior: scrollBehavior(), block: 'start' });
      });

      /* ---------- confete de formas (determinístico: layout estável) ---------- */
      function initConfetti() {
        const NS = 'http://www.w3.org/2000/svg';
        const rng = (seed) => {
          let s = seed;
          return () => {
            s = (s * 1664525 + 1013904223) % 4294967296;
            return s / 4294967296;
          };
        };
        const mk = (tag, attrs) => {
          const node = document.createElementNS(NS, tag);
          Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
          return node;
        };
        document.querySelectorAll('[data-confetti]').forEach((el) => {
          if (el.firstElementChild) return;
          const hero = el.dataset.confetti === 'hero';
          const r = rng(hero ? 7 : 21);
          const count = hero ? 46 : 38;
          const W = 1200;
          const H = 700;
          const svg = mk('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'xMidYMid slice' });
          for (let i = 0; i < count; i++) {
            const x = r() * W;
            const y = r() * H;
            const s = 16 + r() * 34;
            const rot = r() * 360;
            const col = CONFETTI_COLORS[Math.floor(r() * CONFETTI_COLORS.length)];
            const kind = Math.floor(r() * 6);
            let fill = r() > 0.72;
            const g = mk('g', { transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)})` });
            let node;
            if (kind === 0) {
              node = mk('rect', { x: -s / 2, y: -s / 2, width: s, height: s, rx: 3 });
            } else if (kind === 1) {
              node = mk('path', { d: `M0 ${-s * 0.6} L${s * 0.6} ${s * 0.5} L${-s * 0.6} ${s * 0.5}Z`, 'stroke-linejoin': 'round' });
            } else if (kind === 2) {
              node = mk('circle', { r: s / 2 });
            } else if (kind === 3) {
              const a = s / 2;
              node = mk('path', { d: `M${a * 0.3} ${-a}A${a} ${a} 0 1 0 ${a * 0.3} ${a}A${a * 0.8} ${a * 0.8} 0 0 1 ${a * 0.3} ${-a}Z` });
              fill = true;
            } else if (kind === 4) {
              node = mk('g', {});
              fill = true;
              const w = s * 0.22;
              for (let k = 0; k < 3; k++) {
                node.appendChild(mk('rect', { x: -w / 2, y: -s / 2, width: w, height: s, rx: w / 2, transform: `rotate(${k * 60})`, fill: col }));
              }
            } else {
              node = mk('rect', { x: -s * 0.22, y: -s * 0.22, width: s * 0.44, height: s * 0.44, rx: 2 });
              fill = true;
            }
            if (kind !== 4) {
              if (fill) {
                node.setAttribute('fill', col);
              } else {
                node.setAttribute('fill', 'none');
                node.setAttribute('stroke', col);
                node.setAttribute('stroke-width', '2.5');
              }
            }
            g.appendChild(node);
            svg.appendChild(g);
          }
          el.appendChild(svg);
        });
      }

      /* ---------- copiar e-mail ---------- */
      document.addEventListener('click', (event) => {
        const btn = event.target.closest('#copy-btn');
        if (!btn) return;
        const addr = document.getElementById('mail-addr');
        const label = document.getElementById('copy-lbl');
        if (!addr || !label) return;
        const done = () => {
          label.textContent = t('copy-done');
          setTimeout(() => {
            label.textContent = t('copy-email');
          }, 1800);
        };
        const fallback = () => {
          const range = document.createRange();
          range.selectNodeContents(addr);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        };
        try {
          navigator.clipboard.writeText(addr.textContent.trim()).then(done, fallback);
        } catch (e) {
          fallback();
        }
      });

      document.body.addEventListener('htmx:afterOnLoad', (event) => {
        translatePage();
        updateLanguageButtons();
        initConfetti();
        window.scrollTo(0, 0);

        // Ao abrir um case, o botão clicado some do DOM: move o foco para o
        // título do case para que teclado e leitores de tela não se percam.
        const path =
          (event.detail && event.detail.pathInfo && event.detail.pathInfo.requestPath) || '';
        if (path.includes('components/case-')) {
          const h1 = document.querySelector('.case-head h1');
          if (h1) {
            h1.setAttribute('tabindex', '-1');
            h1.focus({ preventScroll: true });
          }
        }
      });

      function initLightbox() {
        const dialog = document.getElementById('lightbox');
        const dialogImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('lightbox-close');
        if (!dialog || !dialogImg || !closeBtn) return;
        if (typeof dialog.showModal !== 'function') return;
        let opener = null;

        // Delegação de eventos: funciona para imagens carregadas via HTMX
        document.addEventListener('click', (event) => {
          const trigger = event.target.closest('[data-lightbox]');
          if (trigger) {
            const img = trigger.querySelector('img');
            if (!img) return;
            opener = trigger;
            dialogImg.src = img.currentSrc || img.src;
            dialogImg.alt = img.alt;
            document.documentElement.classList.add('no-scroll');
            dialog.showModal();
            return;
          }
          // Clique no fundo escuro ou na própria imagem fecha o modal
          if (event.target === dialog || event.target === dialogImg) {
            dialog.close();
          }
        });

        closeBtn.addEventListener('click', () => dialog.close());

        // O evento "close" também dispara ao pressionar Esc
        dialog.addEventListener('close', () => {
          document.documentElement.classList.remove('no-scroll');
          dialogImg.removeAttribute('src');
          if (opener) opener.focus();
        });
      }

      initLightbox();

      window.onload = initI18n;
    </script>
